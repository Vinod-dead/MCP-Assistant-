name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest
      # Plumbing gate (mock). With a GEMINI_API_KEY secret, swap in --provider gemini to gate on real accuracy,
      # latency and cost:  python -m mcp_assistant.evaluate --provider gemini --min-tool-acc 0.9 --max-cost 0.01
      - run: python -m mcp_assistant.evaluate --provider mock
