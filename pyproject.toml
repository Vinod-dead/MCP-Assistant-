[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-assistant"
version = "0.1.0"
description = "An MCP-powered AI assistant: files, databases, code, cloud, apps, web and APIs behind one permissioned, audited, traced agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0,<3",
  "google-genai>=1.0",
  "httpx>=0.27",
  "pyyaml>=6",
  "rich>=13",
  "python-dotenv>=1.0",
  "ddgs>=9",
  "pypdf>=4",
  "sqlalchemy>=2",
  "tzdata; sys_platform == 'win32'",
  "fastapi>=0.115",   # Studio API (pure-Python server: uvicorn without the [standard] native extras)
  "uvicorn>=0.30",
]

[project.optional-dependencies]
gcp = ["google-cloud-storage", "google-cloud-bigquery"]
aws = ["boto3"]
azure = ["azure-storage-blob"]
postgres = ["psycopg2-binary"]
mysql = ["pymysql"]
dev = ["pytest>=8"]

[project.scripts]
mcp-assistant = "mcp_assistant.cli:main"
mcp-assistant-eval = "mcp_assistant.evaluate:main"
mcp-assistant-studio = "mcp_assistant.studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mcp_assistant.studio" = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
